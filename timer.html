<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<style>

 
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
  body{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
  .card{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);padding:22px;border-radius:18px;text-align:center;max-width:320px;width:90%;border:1px solid rgba(255,255,255,.15);box-shadow:0 10px 25px rgba(0,0,0,.4)}
  h2{margin-bottom:10px;font-size:18px}
  .ring-box{position:relative;width:160px;height:160px;margin:10px auto}
  svg{transform:rotate(-90deg)}
  circle{fill:none;stroke-width:5;stroke-linecap:round}
  .bg{stroke:rgba(255,255,255,.15)}
  .prog{stroke:#4cc9f0;transition:stroke-dashoffset .3s}
  .time{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:bold}
  .btns{display:flex;gap:8px;justify-content:center;margin:12px 0}
  button{padding:9px 14px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:.2s;background:rgba(255,255,255,.15);color:#fff}
  button:hover{background:rgba(255,255,255,.25)}
  .modes{display:flex;gap:6px;justify-content:center;margin-top:8px}
  .modes button{padding:5px 10px;font-size:12px}
  .active{background:#4cc9f0!important;color:#000!important}
</style>
</head>
<body>
<div class="card">
  <h2>🍅 Pomodoro Timer</h2>

 
  <div class="ring-box">
    <svg width="160" height="160"><circle class="bg" cx="80" cy="80" r="70"/><circle class="prog" id="ring" cx="80" cy="80" r="70" stroke-dasharray="440" stroke-dashoffset="0"/></svg>
    <div class="time" id="time">25:00</div>
  </div>
  <div class="btns">
    <button onclick="toggle()" id="playBtn">▶ Boshlash</button>
    <button onclick="reset()">↺ Qayta</button>
  </div>
  <div class="modes">
    <button onclick="setMode(25,this)" class="active">Ish 25</button>
    <button onclick="setMode(5,this)">Dam 5</button>
    <button onclick="setMode(15,this)">Uzun 15</button>
  </div>
</div>
<script>
  let t=25*60,r=25*60,run=false,id,circ=440;
  const ring=document.getElementById('ring'),time=document.getElementById('time'),play=document.getElementById('playBtn');
  function upd(){ring.style.strokeDashoffset=circ-(t/r)*circ}
  function fmt(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
  function tick(){t--;upd();time.textContent=fmt(t);if(t===0){clearInterval(id);run=false;play.textContent='▶ Boshlash';alert('⏰ Vaqt tugadi!')}}
  function toggle(){run?clearInterval(id):id=setInterval(tick,1000);run=!run;play.textContent=run?'⏸ Pauza':'▶ Boshlash'}
  function reset(){clearInterval(id);run=false;play.textContent='▶ Boshlash';t=r;upd()}
  function setMode(m,b){r=t=m*60;reset();document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
  upd();
</script>
</body>
</html>
